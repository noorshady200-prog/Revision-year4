/* ---------- speech ---------- */
let V=null,on=true,tok=0;
const pick=()=>{if(!window.speechSynthesis)return;const vs=speechSynthesis.getVoices().filter(v=>/^ar/i.test(v.lang));
V=vs.find(v=>/hoda|laila|salma|zariyah|amina|sara|mariam|noura|female|هدى|ليلى|سلمى/i.test(v.name))||vs.find(v=>!/maged|majed|tarik|naayf|hamed|\bmale|ماجد|طارق/i.test(v.name))||null};
if(window.speechSynthesis){pick();speechSynthesis.onvoiceschanged=pick;setTimeout(pick,1800)}
function say(t,cb){if(!window.speechSynthesis)return;speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/▁+/g,"،").replace(/ـ/g,""));
u.lang="ar-SA";if(V){u.voice=V;u.lang=V.lang}u.rate=.8;u.pitch=1.15;if(cb){u.onend=cb;u.onerror=cb}speechSynthesis.speak(u)}
const cheer=t=>{if(on)say(t)};
function readAll(id){const L=[...document.querySelectorAll("#"+id+" .ln")],my=++tok;let i=0;(function nx(){L.forEach(l=>l.classList.remove("hl"));if(my!==tok||i>=L.length)return;L[i].classList.add("hl");say(L[i].dataset.s,()=>{if(my===tok){i++;nx()}})})()}
function stop(){tok++;speechSynthesis&&speechSynthesis.cancel();document.querySelectorAll(".ln.hl").forEach(l=>l.classList.remove("hl"))}

function card(it,k){const id=ITEMS.push(it)-1;it.id=id;let x="";
x+=`<div class="n">${k}</div><div class="qb"><p class="ar">${bl(it.q)}${sp(it.q)}</p><p class="en">${it.e||""}</p></div>`;
if(it.t==="mc")x+=`<div class="opts">`+it.o.map((o,j)=>{const[a,e]=o.split("=");return `<button class="op" data-o="${j}"><span class="mk"></span>${a}${e?`<span class="oe">${e}</span>`:""}</button>`}).join("")+`</div>`;
else if(it.t==="in")x+=`<div class="row"><input dir="rtl" aria-label="الإجابة answer" placeholder="اكتب هنا… Type here"><button class="btn" data-a="chk">تحقّق ✔ Check</button><button class="btn alt" data-a="show">الإجابة 👁 Answer</button></div>`;
else{x+=`<div class="help">`+it.w.map(w=>`<button data-s="${w}">${w}</button>`).join("")+`</div><textarea dir="rtl" aria-label="الفقرة paragraph" placeholder="اكتب فقرتك هنا… Write your paragraph here"></textarea><div class="row"><button class="btn" data-a="chk">تحقّق ✔ Check</button><button class="btn alt" data-a="show">نموذج 👁 Model</button></div><ul class="rub">${RUB.map(r=>`<li>${r}</li>`).join("")}</ul>`}
x+=`<p class="fb" aria-live="polite"></p>`;
if(it.m)x+=`<div class="md"><p class="ar">${it.m}${sp(it.m)}</p><p class="en">${it.me||""}</p></div>`;
return `<div class="q" data-i="${id}">${x}</div>`}
let total=0;
const app=document.getElementById("app"),nav=document.getElementById("nav");
S.forEach((s,si)=>{let h=`<section id="s${si}" style="--c:var(${s.c})">`;
if(s.p)h+=`<div class="psg" id="p${si}"><h2>${s.i} ${s.p.h}</h2><button class="btn" data-a="all" data-p="p${si}">▶ استمع للفقرة · Listen</button><button class="btn alt" data-a="stop">⏹ توقّف · Stop</button>`+s.p.l.map(l=>`<div class="ln" data-s="${l[0]}"><p class="ar">${l[0]}</p><p class="en">${l[1]}</p></div>`).join("")+`</div>`;
s.b.forEach(b=>{h+=`<div class="blk"><b>${b.h}</b><span>${b.e}</span></div>`;b.it.forEach((it,k)=>{if(Array.isArray(it)){it=mc(it[0],it[1],[it[2],it[3],it[4]],it[5])}total++;h+=card(it,k+1)})});

const upd=()=>{document.getElementById("sc").textContent=`⭐ ${score} / ${total}`;document.getElementById("pg").style.width=(100*score/total)+"%";if(score===total){const d=document.getElementById("dn");d.style.display="block";cheer("أحسنت! لقد أنهيت كل الأسئلة")}};upd();

if(ok){md.classList.add("on");win(c);cheer("أحسنت")}else cheer("حاول مرة أخرى");return}
ok=nv&&(it.a?it.a.some(x=>NW(x)===nv):it.k.every(k=>nv.includes(NW(k))));
if(ok){fb.innerHTML="✅ إِجَابَةٌ صَحِيحَةٌ! <small>Correct!</small>";md&&md.classList.add("on");win(c);cheer("أحسنت")}
else{fb.innerHTML="❌ حَاوِلْ مَرَّةً أُخْرَى <small>Not quite — try again, or press Answer.</small>";c.classList.add("shake");setTimeout(()=>c.classList.remove("shake"),400);cheer("حاول مرة أخرى")}
return}
const op=t.closest(".op");
if(op){const c=op.closest(".q"),it=ITEMS[c.dataset.i],j=+op.dataset.o,fb=c.querySelector(".fb");if(c.classList.contains("ok"))return;
if(j===it.c){c.querySelectorAll(".op").forEach(x=>x.disabled=true);op.classList.add("good");op.querySelector(".mk").textContent="✓";
const full=it.q.replace(/▁+/g,it.o[j].split("=")[0]).replace(/ـ/g,"");
fb.innerHTML=`✅ أَحْسَنْتَ! إِجَابَةٌ صَحِيحَةٌ <small>Well done! Correct.</small>`+(/▁/.test(it.q)?`<br><span class="ar">${full}</span>`:"");win(c);if(on)say(/▁/.test(it.q)?full:"أحسنت")}
else{op.classList.add("bad");op.disabled=true;op.querySelector(".mk").textContent="✗";fb.innerHTML="❌ خَطَأ — حَاوِلْ مَرَّةً أُخْرَى <small>Wrong — try again!</small>";c.classList.add("shake");setTimeout(()=>c.classList.remove("shake"),400);cheer("حاول مرة أخرى")}}
});
